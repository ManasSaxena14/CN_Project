# ───────────────────────────────────────────────────────────
# dnsmasq.conf  — Private DNS for team1.test
# Mac 1 runs this; all other Macs point here as DNS.
# ───────────────────────────────────────────────────────────

# --- Listen on all interfaces, UDP port 53 ---
listen-address=0.0.0.0
port=53

# --- Our authoritative records  (app & api → MAC2_IP) ---
# IMPORTANT: update MAC2_IP here when config.env IPs change
address=/app.team1.test/10.81.95.225
address=/api.team1.test/10.81.95.225

# --- TTL for our records (60 seconds) ---
local-ttl=60

# --- NXDOMAIN for any other .test name we don't own ---
# (prevents leaking private names to upstream)
local=/test/

# --- Forward everything else to real DNS (internet works) ---
server=8.8.8.8
server=8.8.4.4

# --- Don't read /etc/resolv.conf (we ARE the resolver) ---
no-resolv

# --- Don't use /etc/hosts ---
no-hosts

# --- Log queries for debugging (view with: log stream --predicate ...) ---
log-queries

# --- Don't run as a daemon so we see stdout ---
keep-in-foreground
