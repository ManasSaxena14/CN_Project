listen-address=0.0.0.0
port=53

# Authoritative records for team1.test
address=/app.team1.test/10.81.95.225
address=/api.team1.test/10.81.95.225

# TTL for project records (Phase 2: 30s)
local-ttl=30

# Authoritative boundary: NXDOMAIN for any unknown .test names
local=/team1.test/
local=/test/

# Forward non-project queries (e.g. google.com) to public DNS
server=8.8.8.8
server=8.8.4.4

# Do not read host /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Query logging for viva inspection
log-queries

# Foreground operation
keep-in-foreground
